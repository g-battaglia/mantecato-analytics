# Select this config explicitly on a separate Railway cron service.
# Never use the web service's /railway.toml or run Gunicorn in this service.
"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"
watchPatterns = ["apps/**", "core/**", "mantecato/**", "manage.py", "pyproject.toml", "uv.lock", "railway.rollup.toml"]

[deploy]
startCommand = "uv run python manage.py rollup_visitors --max-runtime 900 --sql-timeout-ms 60000"
cronSchedule = "15 2 * * *"
restartPolicyType = "NEVER"
# No pre-deploy, HTTP health check, imports, migrations or web server.
