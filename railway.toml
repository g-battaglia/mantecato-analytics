# railway.toml — Mantecato (Django) — Railway config-as-code (2026)
# Docs: https://docs.railway.com/reference/config-as-code
"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"
# Il Dockerfile di self-hosting è rinominato `Dockerfile.standalone` di proposito:
# Railway userebbe in automatico un file chiamato esattamente `Dockerfile`,
# scavalcando questo `builder = "RAILPACK"`. Con l'altro nome, Railpack ha effetto.
# Railpack rileva uv.lock + pyproject.toml + manage.py ed esegue `uv sync`.
# Non esegue collectstatic da solo: lo facciamo qui, sul sorgente completo.
buildCommand = "uv run python manage.py collectstatic --noinput"
watchPatterns = [
  "apps/**",
  "core/**",
  "mantecato/**",
  "static/**",
  "templates/**",
  "manage.py",
  "pyproject.toml",
  "uv.lock",
  "railway.toml",
]

[deploy]
# preDeployCommand gira UNA volta, prima che la nuova versione riceva traffico.
# Ideale per: migrazioni + hook umami (inerte di default) + bootstrap admin opzionale.
# migrate qui (non nello startCommand) => nessuna race su repliche multiple e
# deploy atomico: se migrate fallisce, Railway non promuove la nuova versione.
# L'admin di bootstrap viene creato SOLO se INIT_ADMIN_PASS è impostata: niente
# password di default (un deploy pubblico con credenziali note sarebbe critico).
preDeployCommand = "uv run python manage.py migrate --noinput && uv run python manage.py importumamienv && if [ -n \"${INIT_ADMIN_PASS:-}\" ]; then uv run python manage.py createuser \"${INIT_ADMIN_USER:-admin}\" --role admin --password \"$INIT_ADMIN_PASS\" --password-is-default || true; fi"
# Railway inietta $PORT; gunicorn deve ascoltare su 0.0.0.0:$PORT.
# Native Gunicorn 26 ASGI/lifespan, bounded connections; keep-alive disabled
# after isolated SDK/Django HTTP tests found stalls with persistent sockets.
# For Railway TLS termination, set USE_SECURE_PROXY_SSL_HEADER=True in service
# Variables. Django and remote MCP share this HTTPS configuration.
startCommand = "uv run gunicorn mantecato.asgi:application --worker-class asgi --worker-connections ${GUNICORN_WORKER_CONNECTIONS:-16} --keep-alive 0 --bind 0.0.0.0:$PORT --workers ${GUNICORN_WORKERS:-2} --timeout ${GUNICORN_TIMEOUT:-120} --access-logfile - --access-logformat '%(m)s %(s)s %(D)s' --error-logfile -"
# /health/ esegue SELECT 1 sul DB: timeout generoso per il primo boot del Postgres.
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
