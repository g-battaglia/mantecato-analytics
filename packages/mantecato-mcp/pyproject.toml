[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mantecato-mcp"
version = "1.0.0"
description = "Read-only MCP server for remote Mantecato analytics"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27,<1.0",
    "mcp>=1.12,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
mantecato-mcp = "mantecato_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
