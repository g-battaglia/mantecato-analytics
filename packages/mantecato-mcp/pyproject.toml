[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "mantecato-mcp"
version = "1.0.0"
description = "Read-only MCP server for remote Mantecato analytics"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1,<1.0",
    "mcp>=2.3,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10.0", "pytest-asyncio>=1.4.1.post1,<2.0", "ruff>=0.17.4,<0.18"]

[project.scripts]
mantecato-mcp = "mantecato_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
