[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "mantecato-cli"
version = "1.0.0"
description = "Remote command-line client for Mantecato analytics"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1,<1.0",
    "typer>=0.29.1,<1.0",
    "rich>=15.0,<16.0",
    "PyYAML>=6.0.3,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10.0", "ruff>=0.17.4,<0.18"]

[project.scripts]
mantecato = "mantecato_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
